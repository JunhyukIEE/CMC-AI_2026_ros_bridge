mpc_controller:
  ros__parameters:
    # Vehicle parameters
    wheelbase: 2.7  # [m] Distance between front and rear axles

    # Control loop rate
    control_rate: 50.0  # [Hz] INCREASED for faster response

    # MPC prediction parameters
    prediction_horizon: 15  # Number of prediction steps
    prediction_dt: 0.1      # [s] Time step for prediction

    # Cost function weights (NEW: Reference path tracking based)
    # weight_cte: Now represents X and Y position error weights
    # weight_heading: Now represents yaw angle error weight
    weight_cte: 10.0           # Position tracking weight, drastically reduced for stability
    weight_heading: 10.0       # Heading tracking weight, drastically reduced for stability
    weight_steering: 1000.0      # Steering cost, significantly increased to reduce movement
    weight_steering_rate: 1000.0 # Steering rate cost, significantly increased for damping

    # Output limits
    steering_max: 1.0    # Maximum steering angle command
    steering_min: -1.0   # Minimum steering angle command
    steering_angle_limit_deg: 33.0 # Maximum physical steering angle in degrees

    # Low-pass filter for steering output
    steering_filter_alpha: 0.8  # Filter coefficient (0-1): more filtering for smoothness
