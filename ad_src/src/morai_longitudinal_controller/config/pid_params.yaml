pid_controller:
  ros__parameters:
    # PID gains
    kp: 0.55          # Proportional gain
    ki: 0.1          # Integral gain
    kd: 0.08          # Derivative gain

    # Control loop rate
    control_rate: 50.0  # [Hz] INCREASED for faster response

    # Anti-windup limits for integral term
    integral_max: 10.0
    integral_min: -10.0

    # Output limits
    accel_max: 1.0   # Maximum acceleration command [0-1]
    accel_min: 0.0   # Minimum acceleration command
    brake_max: 1.0   # Maximum brake command [0-1]
    brake_min: 0.0   # Minimum brake command