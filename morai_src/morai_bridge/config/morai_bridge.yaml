morai_bridge_launch:
  ros__parameters:
    # MORAI rear-axle origin to Autoware ground-projected base_link offset.
    wheel_radius: 0.36

morai_sensor_receiver_node:
  ros__parameters:
    slam_mode: false
    map_frame: map
    lidar_frame: velodyne_top
    gnss_frame: gnss_link
    imu_frame: imu
    # Set to 0.0 to publish the original MORAI orientation without correction.
    imu_yaw_offset_deg: -1.347045

morai_sender_node:
  ros__parameters:
    simulator_ip: "192.168.0.27"
    cmd_udp_port: 9091
    max_brake_command: 0.63
