morai_sensor_receiver_node:
  ros__parameters:
    slam_mode: false
    map_frame: map
    lidar_frame: velodyne_top
    gnss_frame: gnss_link
    imu_frame: imu
    # Set to 0.0 to publish the original MORAI orientation without correction.
    imu_yaw_offset_deg: -1.347045

morai_sender_node:
  ros__parameters:
    simulator_ip: "192.168.0.1"
    cmd_udp_port: 9091
    speed_debug: true  # Warn above 60 km/h (at most once per second); false disables warnings.
    speed_kp: 0.75
    speed_ki: 0.01
    speed_kd: 0.03
    integral_limit: 5.0
    velocity_deadband_mps: 0.1
    max_throttle_command: 1.0
    max_brake_command: 0.63
    standstill_brake_command: 0.1
    velocity_timeout_sec: 0.2
