/**:
  ros__parameters:
    # 디버그 모드 (패킷 정보 출력)
    debug_mode: false
    # bbox 위치 검증용 별도 image 토픽 (기본 비활성화)
    publish_bbox_overlay: false

    # 동기화 활성화
    enable_sync: false
    # 동기화 타임아웃 (초) - 이 시간 안에 모든 카메라 데이터가 도착하지 않으면 해당 프레임 ID 폐기
    sync_timeout_sec: 0.08
    # 동기화 윈도우 (밀리초) - 이 범위 내의 frame_id를 같은 프레임으로 취급
    sync_window_ms: 50.0

    # 최대 버퍼링할 프레임 수 (메모리 관리)
    max_buffered_frames: 2

    # 프레임 타임아웃 (초) - 이 시간 동안 완성되지 않은 프레임은 버림
    frame_timeout_sec: 1.0
    # 실제 BOX timestamp가 MOR보다 수 ms 늦어 대응 이미지를 찾는 허용 오차
    bbox_match_tolerance_ms: 20.0

    # 사용할 camera_N 블록만 주석 해제
    camera_0:
      name: "front_camera/camera_optical_link"
      ip: "192.168.0.37"
      port: 9001
      topic_name: "/sensing/camera/camera0/image_raw"
      width: 1280
      height: 720
      channels: 3
      hfov_deg: 90.0
      compressed: false

    camera_1:
      name: "left_camera/camera_optical_link"
      ip: "192.168.0.37"
      port: 9002
      topic_name: "/sensing/camera/camera1/image_raw"
      width: 640
      height: 480
      channels: 3
      hfov_deg: 130.0
      compressed: false

    camera_2:
      name: "right_camera/camera_optical_link"
      ip: "192.168.0.37"
      port: 9003
      topic_name: "/sensing/camera/camera2/image_raw"
      width: 640
      height: 480
      channels: 3
      hfov_deg: 130.0
      compressed: false

