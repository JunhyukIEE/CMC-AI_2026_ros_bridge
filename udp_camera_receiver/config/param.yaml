/**:
  ros__parameters:
    # 디버그 모드 (패킷 정보 출력)
    debug_mode: false

    # 동기화 활성화
    enable_sync: false
    # 동기화 타임아웃 (초) - 이 시간 안에 모든 카메라 데이터가 도착하지 않으면 해당 프레임 ID 폐기
    sync_timeout_sec: 0.1
    # 동기화 윈도우 (밀리초) - 이 범위 내의 frame_id를 같은 프레임으로 취급
    sync_window_ms: 100.0

    # 최대 버퍼링할 프레임 수 (메모리 관리)
    max_buffered_frames: 5

    # 프레임 타임아웃 (초) - 이 시간 동안 완성되지 않은 프레임은 버림
    frame_timeout_sec: 1.0

    # 카메라 개수
    num_cameras: 1

    # 한 대만 실행하므로 camera_0 슬롯에 MORAI 카메라 3(port 9004)을 매핑
    camera_0:
      name: "traffic_light_left_camera/camera_optical_link"
      ip: "192.168.0.37"
      port: 9004
      topic_name: "/sensing/camera/camera7/image_raw/compressed"
      width: 640
      height: 480
      channels: 3
      hfov_deg: 45.0
      compressed: true

    # 카메라 1 설정
    # camera_1:
    #   name: "left_camera"
    #   ip: "192.168.0.37"
    #   port: 9002
    #   topic_name: "/camera/left_camera/image_raw"
    #   width: 640
    #   height: 480
    #   channels: 3

    # 카메라 2 설정
